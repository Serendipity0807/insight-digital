server:
  port: 8080

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: mall-product             # 路由唯一 id,语义化命名
          uri: lb://mall-product       # 按服务名从 Nacos 找实例,负载均衡
          predicates:
            - Path=/api/v1/product/**  # 命中此路径 → 原样转发给 mall-product
        - id: mall-user
          uri: lb://mall-user
          predicates:
            - Path=/api/v1/user/**
        - id: mall-cart
          uri: lb://mall-cart
          predicates:
            - Path=/api/v1/cart/**
        - id: mall-order
          uri: lb://mall-order
          predicates:
            - Path=/api/v1/order/**
        - id: mall-inventory
          uri: lb://mall-inventory
          predicates:
            - Path=/api/v1/inventory/**
        - id: mall-payment
          uri: lb://mall-payment
          predicates:
            - Path=/api/v1/payment/**
        - id: mall-search
          uri: lb://mall-search
          predicates:
            - Path=/api/v1/search/**
        - id: mall-promotion
          uri: lb://mall-promotion
          predicates:
            - Path=/api/v1/promotion/**
        - id: mall-notify            # 新增:通知
          uri: lb://mall-notify
          predicates:
            - Path=/api/v1/notify/**


jwt:
  secret: insight-digital-jwt-secret-key-please-change-me-2026   # 必须与 mall-user 完全一致,否则验签全挂

# API 文档仅在 swagger profile 下开启。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
