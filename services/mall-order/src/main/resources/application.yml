server:
  port: 8084

spring:
  application:
    name: mall-order
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/mall_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

seata:
  tx-service-group: insight-tx-group
  service:
    vgroup-mapping:
      insight-tx-group: default
    grouplist:
      default: 127.0.0.1:8091

rocketmq:
  name-server: 127.0.0.1:9876
  # 延时等级(开源版固定 18 级):3 = 10 秒(本机演示),16 = 30 分钟(生产)
  close-delay-level: 16

# API 文档仅在 swagger profile 下开启。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
