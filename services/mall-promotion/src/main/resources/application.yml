server:
  port: 8087

spring:
  application:
    name: mall-promotion
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      eager: true          # 启动即向控制台注册(懒加载时控制台看不到本服务)
      transport:
        dashboard: localhost:8858   # 控制台地址(现在只当监控台用)
        port: 8719                  # 本机端口,控制台靠它下发规则/收监控数据
      datasource:
        flow:                        # 数据源名,唯一即可
          nacos:
            server-addr: localhost:8848
            data-id: mall-promotion-sentinel-flow   # 与 Nacos 配置中心的 dataId 对应
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow           # 这份配置存的是"流控规则"
  datasource:
    url: jdbc:mysql://localhost:3306/mall_promotion?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 3   # 按服务分逻辑库:秒杀库存、优惠券用 db3(架构蓝图第 9 节)

rocketmq:
  name-server: 127.0.0.1:9876

# API 文档仅在 swagger profile 下开启。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
