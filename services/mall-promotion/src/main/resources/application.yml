server:
  port: 8087

spring:
  application:
    name: mall-promotion
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      eager: true          # 启动即向控制台注册:否则"懒加载",没有流量时控制台根本看不到本服务
      transport:
        dashboard: localhost:8858   # 控制台地址
        port: 8719                  # 本机开一个端口,控制台靠它下发规则/收监控数据(不要与别的服务冲突)
  datasource:
    url: jdbc:mysql://localhost:3306/mall_promotion?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 3   # 按服务分逻辑库:秒杀库存、优惠券用 db3(架构蓝图第 9 节)

rocketmq:
  name-server: 127.0.0.1:9876
