server:
  port: 8081

spring:
  application:
    name: mall-user
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  # HS256 要求至少 32 字节,下面这段先占位,生产务必换环境变量/Nacos 注入
  secret: insight-digital-jwt-secret-key-please-change-me-2026
  expire: 86400000   # 24 小时,单位毫秒

# API 文档仅在 swagger profile 下开启。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
