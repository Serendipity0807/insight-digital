server:
  port: 8088

spring:
  application:
    name: mall-search          # Nacos 注册名,网关 lb://mall-search 认这个名字
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

elasticsearch:
  url: http://localhost:9200

rocketmq:
  name-server: 127.0.0.1:9876

# API 文档仅在 swagger profile 下开启。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
